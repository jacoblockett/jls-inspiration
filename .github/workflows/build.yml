name: Build

on:
  schedule:
    - cron: '0 23 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:
    inputs:
      action:
        description: What to run
        required: true
        default: build
        type: choice
        options:
          - build
          - nightly
          - stable
      target:
        description: Build target (used only when action is build)
        required: true
        default: linux-x64-gnu
        type: choice
        options:
          - linux-x64-gnu
          - windows-x64
          - windows-arm64
          - macos-x64
          - macos-arm64
          - linux-arm64-gnu
          - linux-x64-musl
          - linux-arm64-musl
          - all
      version:
        description: Stable semantic version (for example 0.1.0)
        required: false
        type: string
      force:
        description: Force a nightly even when no build-relevant source changed
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: jls-inspiration-build
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      should_build: ${{ steps.mode.outputs.should_build }}
      release_tag: ${{ steps.mode.outputs.release_tag }}
      matrix: ${{ steps.mode.outputs.matrix }}
      aggregate_build: ${{ steps.mode.outputs.aggregate_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          mode=nightly
          if [[ '${{ github.event_name }}' == 'workflow_dispatch' ]]; then
            mode='${{ inputs.action }}'
          fi
          if [[ '${{ github.ref }}' != 'refs/heads/main' ]]; then
            echo 'Build and release automation may only run from main.' >&2
            exit 1
          fi

          manifest_version="$(jq -er '.version' manifest.json)"
          if [[ ! "$manifest_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Inspiration manifest version must be plain semver: $manifest_version" >&2
            exit 1
          fi

          all_matrix="$(jq -nc '{include:[
            {target:"windows-x64",runner:"windows-2025",bun_target:"bun-windows-x64-baseline",history:"history.exe",screenshot:"screenshot.exe",musl:false},
            {target:"windows-arm64",runner:"windows-11-vs2026-arm",bun_target:"bun-windows-arm64",history:"history.exe",screenshot:"screenshot.exe",musl:false},
            {target:"macos-x64",runner:"macos-15-intel",bun_target:"bun-darwin-x64-baseline",history:"history",screenshot:"screenshot",musl:false},
            {target:"macos-arm64",runner:"macos-15",bun_target:"bun-darwin-arm64",history:"history",screenshot:"screenshot",musl:false},
            {target:"linux-x64-gnu",runner:"ubuntu-24.04",bun_target:"bun-linux-x64-baseline",history:"history",screenshot:"screenshot",musl:false},
            {target:"linux-arm64-gnu",runner:"ubuntu-24.04-arm",bun_target:"bun-linux-arm64",history:"history",screenshot:"screenshot",musl:false},
            {target:"linux-x64-musl",runner:"ubuntu-24.04",bun_target:"bun-linux-x64-musl",history:"history",screenshot:"screenshot",musl:true},
            {target:"linux-arm64-musl",runner:"ubuntu-24.04-arm",bun_target:"bun-linux-arm64-musl",history:"history",screenshot:"screenshot",musl:true}
          ]}')"
          matrix="$all_matrix"

          should_build=true
          aggregate_build=false
          release_tag=dev
          if [[ "$mode" == nightly ]]; then
            force='${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}'
            git fetch origin --tags --force
            if [[ "$force" != true ]] && git rev-parse -q --verify refs/tags/nightly >/dev/null; then
              mapfile -t files < <(git diff --name-only nightly..HEAD -- .github/workflows/build.yml .github/workflows/version-check.yml manifest.json SKILL.md AGENTS.md history screenshot agents)
              if (( ${#files[@]} == 0 )); then should_build=false; fi
            fi
            release_tag=nightly
          elif [[ "$mode" == stable ]]; then
            requested_version='${{ inputs.version }}'
            if [[ ! "$requested_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo 'Stable releases require an explicit plain-semver version input, for example 0.1.0.' >&2
              exit 1
            fi
            if [[ "$requested_version" != "$manifest_version" ]]; then
              echo "Requested stable version $requested_version does not match manifest.json version $manifest_version." >&2
              exit 1
            fi
            release_tag="v$requested_version"
            git fetch origin --tags --force
            if git rev-parse -q --verify "refs/tags/$release_tag" >/dev/null; then
              echo "Tag $release_tag already exists." >&2
              exit 1
            fi
          elif [[ "$mode" == build ]]; then
            requested_target='${{ inputs.target }}'
            if [[ "$requested_target" == all ]]; then
              aggregate_build=true
            else
              matrix="$(jq -c --arg target "$requested_target" '{include: [.include[] | select(.target == $target)]}' <<< "$all_matrix")"
              if [[ "$(jq '.include | length' <<< "$matrix")" -ne 1 ]]; then
                echo "Unknown build target: $requested_target" >&2
                exit 1
              fi
            fi
          else
            echo "Unknown build mode: $mode" >&2
            exit 1
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "aggregate_build=$aggregate_build" >> "$GITHUB_OUTPUT"

      - name: No release build
        if: steps.mode.outputs.should_build != 'true'
        run: echo 'Nothing to build or publish.'

  build:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: "${{ matrix.runner }}"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
          run_install: false

      - name: Install screenshot build dependency
        shell: bash
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: pnpm --dir screenshot install --frozen-lockfile

      - name: Run history regressions
        if: matrix.target == 'linux-x64-gnu'
        shell: bash
        run: bun test history/history.test.mjs

      - name: Build history and screenshot executables
        shell: bash
        run: |
          mkdir -p build
          bun build history/history.mjs \
            --compile \
            --minify \
            --target '${{ matrix.bun_target }}' \
            --outfile 'build/${{ matrix.history }}'
          bun build screenshot/screenshot.mjs \
            --compile \
            --minify \
            --external typescript \
            --target '${{ matrix.bun_target }}' \
            --outfile 'build/${{ matrix.screenshot }}'

      - name: Launch target executables
        if: matrix.musl == false
        shell: bash
        run: |
          './build/${{ matrix.history }}' --help >/dev/null
          './build/${{ matrix.screenshot }}' --help >/dev/null

      - name: Launch musl executables in Alpine
        if: matrix.musl == true
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user root --entrypoint sh -v "$PWD:/work" -w /work oven/bun:1.4.0-alpine -lc "./build/${{ matrix.history }} --help >/dev/null && ./build/${{ matrix.screenshot }} --help >/dev/null"

      - name: Upload target executables
        uses: actions/upload-artifact@v4
        with:
          name: target-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/${{ matrix.history }}
            build/${{ matrix.screenshot }}

  aggregate:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_build == 'true' && (needs.prepare.outputs.mode != 'build' || needs.prepare.outputs.aggregate_build == 'true')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all target executables
        uses: actions/download-artifact@v4
        with:
          pattern: target-*
          path: build/targets
          merge-multiple: false

      - name: Package and verify complete Inspiration release
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail

          targets=(windows-x64 windows-arm64 macos-x64 macos-arm64 linux-x64-gnu linux-arm64-gnu linux-x64-musl linux-arm64-musl)
          histories=(history.exe history.exe history history history history history history)
          screenshots=(screenshot.exe screenshot.exe screenshot screenshot screenshot screenshot screenshot screenshot)

          version="$(jq -er '.version' manifest.json)"
          min_installer="$(jq -er '.min_installer' manifest.json)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$min_installer" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(jq -r '.name' manifest.json)" == inspiration ]]

          while IFS= read -r path; do test -f "$path"; done < <(
            jq -r '[.skill_files[], .instruction_fragment, (.harness_resources | to_entries[] | .value | to_entries[] | .value[])] | .[]' manifest.json
          )

          grep -q '^name: inspiration$' SKILL.md
          for agent in brief visual-researcher visual-auditor product-researcher product-auditor synthesizer; do
            grep -q "^name = \"inspiration-$agent\"$" "agents/codex/inspiration-$agent.toml"
            grep -q "^name: inspiration-$agent$" "agents/claude/inspiration-$agent.md"
          done

          [[ "$(jq -r '.tools.history.token' manifest.json)" == HISTORY_CLI ]]
          [[ "$(jq -r '.tools.screenshot.token' manifest.json)" == SCREENSHOT_CLI ]]
          test "$(jq '.tools.history.artifacts | length' manifest.json)" -eq 8
          test "$(jq '.tools.screenshot.artifacts | length' manifest.json)" -eq 8

          rm -rf build/release
          mkdir -p build/release
          jq '
            {name, version, min_installer, description, artifacts: {}}
            + (if has("dependencies") then {dependencies} else {} end)
          ' manifest.json > build/release/manifest.json

          for i in "${!targets[@]}"; do
            target="${targets[$i]}"
            history="${histories[$i]}"
            screenshot="${screenshots[$i]}"
            history_source="build/targets/target-$target/$history"
            screenshot_source="build/targets/target-$target/$screenshot"
            archive="$PWD/build/release/inspiration-$target.zip"
            stage="$PWD/build/.package-$target"

            test -f "$history_source"
            test -f "$screenshot_source"
            rm -rf "$stage"
            mkdir -p "$stage/bin"
            cp SKILL.md AGENTS.md LICENSE "$stage/"
            cp -R agents "$stage/agents"
            cp "$history_source" "$stage/bin/$history"
            cp "$screenshot_source" "$stage/bin/$screenshot"
            if [[ "$target" != windows-* ]]; then
              chmod +x "$stage/bin/$history" "$stage/bin/$screenshot"
            fi

            history_path="bin/$history"
            screenshot_path="bin/$screenshot"
            jq --arg target "$target" --arg history_path "$history_path" --arg screenshot_path "$screenshot_path" '
              .tools.history.artifacts = {($target): $history_path}
              | .tools.screenshot.artifacts = {($target): $screenshot_path}
            ' manifest.json > "$stage/manifest.json"

            (cd "$stage" && zip -q -r "$archive" .)
            rm -rf "$stage"

            sha256="$(sha256sum "$archive" | cut -d' ' -f1)"
            url="https://github.com/jacoblockett/jls-inspiration/releases/download/$RELEASE_TAG/inspiration-$target.zip"
            tmp="$(mktemp)"
            jq --arg target "$target" --arg url "$url" --arg sha256 "$sha256" \
              '.artifacts[$target] = {url: $url, sha256: $sha256}' \
              build/release/manifest.json > "$tmp"
            mv "$tmp" build/release/manifest.json
          done

          test "$(find build/release -maxdepth 1 -type f | wc -l)" -eq 9
          test "$(jq '.artifacts | length' build/release/manifest.json)" -eq 8
          jq -e --slurp '
            .[0].description == .[1].description
            and (.[0].dependencies // null) == (.[1].dependencies // null)
          ' build/release/manifest.json manifest.json >/dev/null

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          if-no-files-found: error
          retention-days: 14
          path: build/release/*

  publish:
    needs: [prepare, aggregate]
    if: needs.prepare.outputs.should_build == 'true' && needs.prepare.outputs.mode != 'build'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: build/release

      - name: Publish verified release bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_MODE: ${{ needs.prepare.outputs.mode }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find build/release -maxdepth 1 -type f -print | sort)
          if (( ${#assets[@]} == 0 )); then echo 'Verified release bundle is empty.' >&2; exit 1; fi

          if [[ "$RELEASE_MODE" == nightly ]]; then
            if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
              gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GH_REPO" --clobber
              mapfile -t existing < <(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json assets --jq '.assets[].name')
              for name in "${existing[@]}"; do
                if [[ ! -f "build/release/$name" ]]; then gh release delete-asset "$RELEASE_TAG" "$name" --repo "$GH_REPO" -y; fi
              done
            else
              gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GH_REPO" --title 'Nightly' --notes 'Rolling production-test build from main.' --prerelease --target "$GITHUB_SHA"
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -f nightly "$GITHUB_SHA"
            git push origin refs/tags/nightly --force
          else
            min_installer="$(jq -er '.min_installer' manifest.json)"
            gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GH_REPO" --title "$RELEASE_TAG" --notes "Requires JLS installer $min_installer or newer." --generate-notes --target "$GITHUB_SHA"
          fi
