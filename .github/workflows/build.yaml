name: Build (Do Not Use)

on:
  workflow_call:
    inputs:
      target:
        description: Build target
        required: false
        default: all
        type: string
      version:
        description: Version to inject; defaults to current stable
        required: false
        default: ''
        type: string
      release_tag:
        description: Release tag used in generated artifact URLs
        required: false
        default: dev
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      matrix: ${{ steps.prepare.outputs.matrix }}
      aggregate: ${{ steps.prepare.outputs.aggregate }}
    steps:
      - name: Resolve build
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TARGET: ${{ inputs.target }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version="$REQUESTED_VERSION"
          if [[ -z "$version" ]]; then
            version=0.0.0
            latest_tag="$(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '[.[] | select(.draft == false and .prerelease == false)][0].tag_name // empty')"
            if [[ -n "$latest_tag" ]]; then
              [[ "$latest_tag" =~ ^v[0-9]+.[0-9]+.[0-9]+$ ]] || { echo "Latest stable release tag must be vMAJOR.MINOR.PATCH: $latest_tag" >&2; exit 1; }
              version="${latest_tag#v}"
            fi
          fi
          [[ "$version" =~ ^[0-9]+.[0-9]+.[0-9]+$ ]] || { echo "Build version must be plain semver: $version" >&2; exit 1; }

          all_matrix="$(jq -nc '{include:[
            {target:"windows-x64",runner:"windows-2025",bun_target:"bun-windows-x64-baseline",history:"history.exe",screenshot:"screenshot.exe",musl:false},
            {target:"windows-arm64",runner:"windows-11-vs2026-arm",bun_target:"bun-windows-arm64",history:"history.exe",screenshot:"screenshot.exe",musl:false},
            {target:"macos-x64",runner:"macos-15-intel",bun_target:"bun-darwin-x64-baseline",history:"history",screenshot:"screenshot",musl:false},
            {target:"macos-arm64",runner:"macos-15",bun_target:"bun-darwin-arm64",history:"history",screenshot:"screenshot",musl:false},
            {target:"linux-x64-gnu",runner:"ubuntu-24.04",bun_target:"bun-linux-x64-baseline",history:"history",screenshot:"screenshot",musl:false},
            {target:"linux-arm64-gnu",runner:"ubuntu-24.04-arm",bun_target:"bun-linux-arm64",history:"history",screenshot:"screenshot",musl:false},
            {target:"linux-x64-musl",runner:"ubuntu-24.04",bun_target:"bun-linux-x64-musl",history:"history",screenshot:"screenshot",musl:true},
            {target:"linux-arm64-musl",runner:"ubuntu-24.04-arm",bun_target:"bun-linux-arm64-musl",history:"history",screenshot:"screenshot",musl:true}
          ]}')"

          matrix="$all_matrix"
          aggregate=true
          if [[ "$REQUESTED_TARGET" != all ]]; then
            matrix="$(jq -c --arg target "$REQUESTED_TARGET" '{include: [.include[] | select(.target == $target)]}' <<< "$all_matrix")"
            [[ "$(jq '.include | length' <<< "$matrix")" -eq 1 ]] || { echo "Unknown build target: $REQUESTED_TARGET" >&2; exit 1; }
            aggregate=false
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "aggregate=$aggregate" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: "${{ matrix.runner }}"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
          run_install: false

      - name: Install screenshot build dependency
        shell: bash
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: pnpm --dir screenshot install --frozen-lockfile

      - name: Run history regressions
        if: matrix.target == 'linux-x64-gnu'
        shell: bash
        run: bun test history/history.test.mjs

      - name: Build history and screenshot executables
        shell: bash
        run: |
          mkdir -p build
          bun build history/history.mjs             --compile             --minify             --target '${{ matrix.bun_target }}'             --outfile 'build/${{ matrix.history }}'
          bun build screenshot/screenshot.mjs             --compile             --minify             --external typescript             --target '${{ matrix.bun_target }}'             --outfile 'build/${{ matrix.screenshot }}'

      - name: Launch target executables
        if: matrix.musl == false
        shell: bash
        run: |
          './build/${{ matrix.history }}' --help >/dev/null
          './build/${{ matrix.screenshot }}' --help >/dev/null

      - name: Launch musl executables in Alpine
        if: matrix.musl == true
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user root --entrypoint sh -v "$PWD:/work" -w /work oven/bun:1.4.0-alpine -lc "./build/${{ matrix.history }} --help >/dev/null && ./build/${{ matrix.screenshot }} --help >/dev/null"

      - name: Upload target executables
        uses: actions/upload-artifact@v4
        with:
          name: target-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/${{ matrix.history }}
            build/${{ matrix.screenshot }}

  aggregate:
    needs: [prepare, build]
    if: needs.prepare.outputs.aggregate == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all target executables
        uses: actions/download-artifact@v4
        with:
          pattern: target-*
          path: build/targets
          merge-multiple: false

      - name: Package and verify complete Inspiration release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          targets=(windows-x64 windows-arm64 macos-x64 macos-arm64 linux-x64-gnu linux-arm64-gnu linux-x64-musl linux-arm64-musl)
          histories=(history.exe history.exe history history history history history history)
          screenshots=(screenshot.exe screenshot.exe screenshot screenshot screenshot screenshot screenshot screenshot)

          version="$BUILD_VERSION"
          [[ "$version" =~ ^[0-9]+.[0-9]+.[0-9]+$ ]]
          [[ "$(jq -r '.name' manifest.json)" == inspiration ]]

          while IFS= read -r path; do test -f "$path"; done < <(
            jq -r '[.skill_files[], .instruction_fragment, (.harness_resources | to_entries[] | .value | to_entries[] | .value[])] | .[]' manifest.json
          )

          grep -q '^name: inspiration$' SKILL.md
          for agent in brief brief-auditor visual-researcher visual-auditor product-researcher product-auditor synthesizer; do
            grep -q "^name = \"inspiration-$agent\"$" "agents/codex/inspiration-$agent.toml"
            grep -q "^name: inspiration-$agent$" "agents/claude/inspiration-$agent.md"
          done

          [[ "$(jq -r '.tools.history.token' manifest.json)" == HISTORY_CLI ]]
          [[ "$(jq -r '.tools.screenshot.token' manifest.json)" == SCREENSHOT_CLI ]]
          test "$(jq '.tools.history.artifacts | length' manifest.json)" -eq 8
          test "$(jq '.tools.screenshot.artifacts | length' manifest.json)" -eq 8

          rm -rf build/release
          mkdir -p build/release
          jq --arg version "$version" '
            {name, version: $version, description, artifacts: {}}
            + (if has("dependencies") then {dependencies} else {} end)
          ' manifest.json > build/release/manifest.json

          for i in "${!targets[@]}"; do
            target="${targets[$i]}"
            history="${histories[$i]}"
            screenshot="${screenshots[$i]}"
            history_source="build/targets/target-$target/$history"
            screenshot_source="build/targets/target-$target/$screenshot"
            archive="$PWD/build/release/inspiration-$target.zip"
            stage="$PWD/build/.package-$target"

            test -f "$history_source"
            test -f "$screenshot_source"
            rm -rf "$stage"
            mkdir -p "$stage/bin"
            cp SKILL.md AGENTS.md LICENSE "$stage/"
            cp -R agents "$stage/agents"
            cp "$history_source" "$stage/bin/$history"
            cp "$screenshot_source" "$stage/bin/$screenshot"
            if [[ "$target" != windows-* ]]; then
              chmod +x "$stage/bin/$history" "$stage/bin/$screenshot"
            fi

            history_path="bin/$history"
            screenshot_path="bin/$screenshot"
            jq --arg version "$version" --arg target "$target" --arg history_path "$history_path" --arg screenshot_path "$screenshot_path" '
              . + {version: $version}
              | .tools.history.artifacts = {($target): $history_path}
              | .tools.screenshot.artifacts = {($target): $screenshot_path}
            ' manifest.json > "$stage/manifest.json"

            (cd "$stage" && zip -q -r "$archive" .)
            rm -rf "$stage"

            sha256="$(sha256sum "$archive" | cut -d' ' -f1)"
            url="https://github.com/jacoblockett/jls-inspiration/releases/download/$RELEASE_TAG/inspiration-$target.zip"
            tmp="$(mktemp)"
            jq --arg target "$target" --arg url "$url" --arg sha256 "$sha256"               '.artifacts[$target] = {url: $url, sha256: $sha256}'               build/release/manifest.json > "$tmp"
            mv "$tmp" build/release/manifest.json
          done

          test "$(find build/release -maxdepth 1 -type f | wc -l)" -eq 9
          test "$(jq '.artifacts | length' build/release/manifest.json)" -eq 8
          jq -e --slurp '
            .[0].description == .[1].description
            and (.[0].dependencies // null) == (.[1].dependencies // null)
          ' build/release/manifest.json manifest.json >/dev/null

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          if-no-files-found: error
          retention-days: 14
          path: build/release/*
